[package]
name = "mathtype-word-addin"
description = "Microsoft Word COM add-in that exposes the equation core as a 公式 ribbon tab."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "mathtype_word_addin"
crate-type = ["cdylib"]

[dependencies]
mt-core.workspace = true
mt-docx.workspace = true
mt-html.workspace = true
mt-batch.workspace = true
mt-layout.workspace = true
mt-omml.workspace = true
mt-numbering.workspace = true
mt-render.workspace = true
mt-tex.workspace = true
ttf-parser = "0.25"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
