# mathtype-rs 样式预设：文本格式，可直接编辑后从编辑器导入。

[meta]
name = 大字号

[sizes]
# 字号，单位为点。
full = 20
text = 20
script = 14
script-script = 10

[spaces]
# 间距，单位为 em（1 em = 全号字号）。
thin-space = 0.2
medium-space = 0.27
thick-space = 0.33
frac-gap = 0.12
frac-nobar-gap = 0.24
radical-gap = 0.12
script-offset = 0.18
subscript-offset = 0.18
limit-gap = 0.2
accent-gap = 0.12
matrix-col-gap = 0.65

[styles]
# 各功能样式的字体：upright / italic / bold / bold-italic / script / fraktur / double-struck /
# sans-serif / monospace / symbol / extra。
text = upright
function = upright
variable = italic
greek = italic
symbol = upright
vector = bold
number = upright

[layout]
alignment = center
