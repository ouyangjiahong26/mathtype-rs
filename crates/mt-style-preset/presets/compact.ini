# mathtype-rs 样式预设：文本格式，可直接编辑后从编辑器导入。

[meta]
name = 紧凑

[sizes]
# 字号，单位为点。
full = 12
text = 12
script = 8
script-script = 6

[spaces]
# 间距，单位为 em（1 em = 全号字号）。
thin-space = 0.13
medium-space = 0.17
thick-space = 0.21
frac-gap = 0.08
frac-nobar-gap = 0.16
radical-gap = 0.08
script-kern = 0.03
script-offset = 0.12
subscript-offset = 0.12
limit-gap = 0.1
fence-kern = 0.04
accent-gap = 0.08
matrix-col-gap = 0.35

[styles]
# 各功能样式的字体：upright / italic / bold / bold-italic / script / fraktur / double-struck /
# sans-serif / monospace / symbol / extra。
text = upright
function = upright
variable = italic
greek = italic
symbol = upright
vector = bold
number = upright

[layout]
alignment = center
