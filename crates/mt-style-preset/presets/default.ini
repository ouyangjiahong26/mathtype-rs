# mathtype-rs 样式预设：文本格式，可直接编辑后从编辑器导入。

[meta]
name = 默认

[sizes]
# 字号，单位为点。
full = 18
text = 18
script = 12.6
script-script = 9

[spaces]
# 间距，单位为 em（1 em = 全号字号）。
thin-space = 0.16666666666666666
medium-space = 0.2222222222222222
thick-space = 0.2777777777777778
frac-rule-thickness = 0.04
frac-gap = 0.1
frac-nobar-gap = 0.2
frac-slash-shift = 0.4
frac-slash-kern = 0.05
radical-rule-thickness = 0.04
radical-gap = 0.1
radical-kern = 0.05
radical-index-gap = 0.1
script-offset = 0.15
subscript-offset = 0.15
script-kern = 0.05
script-min-gap = 0.07
limit-gap = 0.15
fence-kern = 0.05
accent-gap = 0.1
accent-rule-thickness = 0.06
matrix-col-gap = 0.5
matrix-rule-thickness = 0.04

[styles]
# 各功能样式的字体：upright / italic / bold / bold-italic / script / fraktur / double-struck /
# sans-serif / monospace / symbol / extra。
text = upright
function = upright
variable = italic
greek = italic
symbol = upright
vector = bold
number = upright

[layout]
alignment = center
