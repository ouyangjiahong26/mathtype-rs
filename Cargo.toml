[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]
# Plain add-in asset trees (ribbon.xml + JS), not Rust packages.
exclude = ["apps/wps-addin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/mathtype-rs"

[workspace.dependencies]
mt-core = { path = "crates/mt-core" }
mt-tex = { path = "crates/mt-tex" }
mt-mathml = { path = "crates/mt-mathml" }
mt-omml = { path = "crates/mt-omml" }
mt-layout = { path = "crates/mt-layout" }
mt-edit = { path = "crates/mt-edit" }
mt-render = { path = "crates/mt-render" }
mt-mtef = { path = "crates/mt-mtef" }
mt-docx = { path = "crates/mt-docx" }
mt-html = { path = "crates/mt-html" }

[profile.release]
lto = "thin"
codegen-units = 1
